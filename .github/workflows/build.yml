# .github/workflows/build.yml
name: Build KVM for All Platforms

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Флаги для совместимости со старым кодом (GCC 3.3 era)
  CFLAGS_COMPAT: "-std=gnu89 -fno-strict-aliasing -fno-strict-overflow -w"

jobs:
  # ============================================
  # Сборка API (Java классы) - общая для всех
  # ============================================
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build API classes
        run: |
          cd api
          make || {
            echo "Makefile failed, trying manual build..."
            mkdir -p ../bin/common/api/classes
            find src -name "*.java" > sources.txt
            javac -source 1.4 -target 1.4 -d ../bin/common/api/classes @sources.txt 2>/dev/null || \
            javac -source 1.8 -target 1.8 -d ../bin/common/api/classes @sources.txt
          }

      - name: Upload API classes
        uses: actions/upload-artifact@v4
        with:
          name: api-classes
          path: bin/common/api/classes/
          retention-days: 5

  # ============================================
  # Сборка инструментов (JCC, KDP)
  # ============================================
  build-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build JCC tool
        run: |
          cd tools/jcc
          make || {
            echo "Manual JCC build..."
            mkdir -p ../../bin/common/tools/jcc/classes
            find src -name "*.java" > sources.txt
            javac -d ../../bin/common/tools/jcc/classes @sources.txt
          }

      - name: Build KDP tool
        run: |
          cd tools/kdp
          make || {
            echo "Manual KDP build..."
            mkdir -p ../../bin/common/tools/kdp/classes
            find src -name "*.java" > sources.txt
            javac -d ../../bin/common/tools/kdp/classes @sources.txt
          }

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: java-tools
          path: bin/common/tools/
          retention-days: 5

  # ============================================
  # Linux x86_64
  # ============================================
  build-linux-x64:
    runs-on: ubuntu-latest
    needs: [build-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make

      - name: Show GCC version
        run: gcc --version

      - name: Build KVM for Linux
        run: |
          cd build/linux
          # Добавляем флаги совместимости
          make CC="gcc" CFLAGS="${CFLAGS_COMPAT}" || make

      - name: Build KVM debug version
        run: |
          cd build/linux
          make debug CC="gcc" CFLAGS="${CFLAGS_COMPAT} -g -DDEBUG" || true

      - name: Build preverifier for Linux
        run: |
          cd tools/preverifier/build/linux
          make CC="gcc" CFLAGS="${CFLAGS_COMPAT}" || make

      - name: List built binaries
        run: |
          echo "=== bin/linux ===" 
          ls -la bin/linux/ 2>/dev/null || echo "No binaries in bin/linux"
          echo "=== build output ==="
          find . -type f \( -name "kvm*" -o -name "preverify*" \) -executable 2>/dev/null

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvm-linux-x64
          path: |
            bin/linux/
          retention-days: 30

  # ============================================
  # Linux x86 (32-bit)
  # ============================================
  build-linux-x86:
    runs-on: ubuntu-latest
    needs: [build-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib make

      - name: Build KVM for Linux 32-bit
        run: |
          cd build/linux
          make CC="gcc -m32" CFLAGS="${CFLAGS_COMPAT} -m32" LDFLAGS="-m32" || true

      - name: Build preverifier for Linux 32-bit
        run: |
          cd tools/preverifier/build/linux
          make CC="gcc -m32" CFLAGS="${CFLAGS_COMPAT} -m32" LDFLAGS="-m32" || true

      - name: Upload Linux 32-bit binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvm-linux-x86
          path: bin/linux/
          retention-days: 30
        if: always()

  # ============================================
  # Windows (MinGW-w64)
  # ============================================
  build-windows-mingw:
    runs-on: windows-latest
    needs: [build-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            make

      - name: Build KVM for Windows
        shell: msys2 {0}
        run: |
          cd build/win32
          make CC="gcc" CFLAGS="-std=gnu89 -fno-strict-aliasing -w" || true

      - name: Build preverifier for Windows
        shell: msys2 {0}
        run: |
          cd tools/preverifier/build/win32
          make CC="gcc" CFLAGS="-std=gnu89 -fno-strict-aliasing -w" || true

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvm-win32-mingw64
          path: bin/win32/
          retention-days: 30
        if: always()

  # ============================================
  # Windows 32-bit (MinGW-w64 i686)
  # ============================================
  build-windows-mingw32:
    runs-on: windows-latest
    needs: [build-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-make
            make

      - name: Build KVM for Windows 32-bit
        shell: msys2 {0}
        run: |
          cd build/win32
          make CC="gcc" CFLAGS="-std=gnu89 -fno-strict-aliasing -w" || true

      - name: Build preverifier for Windows 32-bit
        shell: msys2 {0}
        run: |
          cd tools/preverifier/build/win32
          make CC="gcc" CFLAGS="-std=gnu89 -fno-strict-aliasing -w" || true

      - name: Upload Windows 32-bit binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvm-win32-i686
          path: bin/win32/
          retention-days: 30
        if: always()

  # ============================================
  # Windows (MSVC)
  # ============================================
  build-windows-msvc:
    runs-on: windows-latest
    needs: [build-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build KVM with MSVC
        shell: cmd
        run: |
          cd build\win32
          nmake -f Makefile CC=cl || echo "MSVC build may need Makefile adjustments"

      - name: Upload Windows MSVC binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvm-win32-msvc
          path: bin/win32/
          retention-days: 30
        if: always()

  # ============================================
  # macOS (Intel)
  # ============================================
  build-macos-intel:
    runs-on: macos-13
    needs: [build-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make gcc

      - name: Build KVM for macOS (using Linux Makefile)
        run: |
          cd build/linux
          # macOS совместим с Unix Makefile
          make CC="gcc" CFLAGS="${CFLAGS_COMPAT}" || true

      - name: Build preverifier for macOS
        run: |
          cd tools/preverifier/build/linux
          make CC="gcc" CFLAGS="${CFLAGS_COMPAT}" || true

      - name: Upload macOS Intel binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvm-macos-intel
          path: bin/linux/
          retention-days: 30
        if: always()

  # ============================================
  # macOS (ARM64 / Apple Silicon)
  # ============================================
  build-macos-arm64:
    runs-on: macos-14
    needs: [build-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build KVM for macOS ARM64
        run: |
          cd build/linux
          make CC="clang" CFLAGS="-std=gnu89 -fno-strict-aliasing -w" || true

      - name: Build preverifier for macOS ARM64
        run: |
          cd tools/preverifier/build/linux
          make CC="clang" CFLAGS="-std=gnu89 -fno-strict-aliasing -w" || true

      - name: Upload macOS ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvm-macos-arm64
          path: bin/linux/
          retention-days: 30
        if: always()

  # ============================================
  # Cross-compile для ARM (Linux)
  # ============================================
  build-linux-arm:
    runs-on: ubuntu-latest
    needs: [build-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Build KVM for ARM
        run: |
          cd build/linux
          make CC="arm-linux-gnueabihf-gcc" \
               CFLAGS="${CFLAGS_COMPAT}" \
               LDFLAGS="-static" || true

      - name: Upload ARM binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvm-linux-arm
          path: bin/linux/
          retention-days: 30
        if: always()

  # ============================================
  # Cross-compile для ARM64 (Linux)
  # ============================================
  build-linux-arm64:
    runs-on: ubuntu-latest
    needs: [build-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build KVM for ARM64
        run: |
          cd build/linux
          make CC="aarch64-linux-gnu-gcc" \
               CFLAGS="${CFLAGS_COMPAT}" \
               LDFLAGS="-static" || true

      - name: Upload ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvm-linux-arm64
          path: bin/linux/
          retention-days: 30
        if: always()

  # ============================================
  # FreeBSD
  # ============================================
  build-freebsd:
    runs-on: ubuntu-latest
    needs: [build-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gcc gmake
          run: |
            cd build/linux
            gmake CC="gcc" CFLAGS="-std=gnu89 -fno-strict-aliasing -w" || true
            cd ../../tools/preverifier/build/linux
            gmake CC="gcc" CFLAGS="-std=gnu89 -fno-strict-aliasing -w" || true

      - name: Upload FreeBSD binaries
        uses: actions/upload-artifact@v4
        with:
          name: kvm-freebsd
          path: bin/linux/
          retention-days: 30
        if: always()

  # ============================================
  # Создание релиза
  # ============================================
  create-release:
    runs-on: ubuntu-latest
    needs: 
      - build-api
      - build-tools
      - build-linux-x64
      - build-linux-x86
      - build-windows-mingw
      - build-windows-mingw32
      - build-macos-intel
      - build-macos-arm64
      - build-linux-arm
      - build-linux-arm64
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release packages
        run: |
          mkdir -p release
          
          # Linux x64
          if [ -d "artifacts/kvm-linux-x64" ]; then
            cd artifacts/kvm-linux-x64
            tar -czvf ../../release/kvm-linux-x64.tar.gz .
            cd ../..
          fi
          
          # Linux x86
          if [ -d "artifacts/kvm-linux-x86" ]; then
            cd artifacts/kvm-linux-x86
            tar -czvf ../../release/kvm-linux-x86.tar.gz .
            cd ../..
          fi
          
          # Windows 64-bit
          if [ -d "artifacts/kvm-win32-mingw64" ]; then
            cd artifacts/kvm-win32-mingw64
            zip -r ../../release/kvm-win64.zip .
            cd ../..
          fi
          
          # Windows 32-bit
          if [ -d "artifacts/kvm-win32-i686" ]; then
            cd artifacts/kvm-win32-i686
            zip -r ../../release/kvm-win32.zip .
            cd ../..
          fi
          
          # macOS Intel
          if [ -d "artifacts/kvm-macos-intel" ]; then
            cd artifacts/kvm-macos-intel
            tar -czvf ../../release/kvm-macos-intel.tar.gz .
            cd ../..
          fi
          
          # macOS ARM64
          if [ -d "artifacts/kvm-macos-arm64" ]; then
            cd artifacts/kvm-macos-arm64
            tar -czvf ../../release/kvm-macos-arm64.tar.gz .
            cd ../..
          fi
          
          # API classes
          if [ -d "artifacts/api-classes" ]; then
            cd artifacts/api-classes
            zip -r ../../release/cldc-api-classes.zip .
            cd ../..
          fi
          
          # Java tools
          if [ -d "artifacts/java-tools" ]; then
            cd artifacts/java-tools
            zip -r ../../release/kvm-tools.zip .
            cd ../..
          fi
          
          ls -la release/

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release/
          retention-days: 90