# .github/workflows/build.yml
name: Build KVM + MIDP 2.0 (Floating Point)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================
  # MIDP классы
  # ============================================
  build-midp-classes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare MIDP classes
        run: |
          mkdir -p bin/midp/classes bin/midp/examples
          cp -r midp2.0fcs/classes/* bin/midp/classes/
          cp midp2.0fcs/example/*.jar bin/midp/examples/ 2>/dev/null || true
          cp midp2.0fcs/example/*.jad bin/midp/examples/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: midp-classes
          path: bin/midp/

  # ============================================
  # Windows 64-bit - ИСПРАВЛЕННАЯ СБОРКА
  # ============================================
  build-windows:
    runs-on: windows-latest
    needs: [build-midp-classes]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make zip

      - uses: actions/download-artifact@v4
        with:
          name: midp-classes
          path: bin/midp/

      - name: Build KVM with Floating Point
        shell: msys2 {0}
        run: |
          set -e  # Останавливаемся при ошибке
          
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║  Building KVM with FLOATING POINT support                  ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          
          mkdir -p bin/win32
          
          # Параметры компиляции
          CC="gcc"
          CFLAGS="-std=gnu89 -O2 -fno-strict-aliasing -w"
          
          # КРИТИЧНО: Определения для floating point
          DEFINES="-DWIN32 -DFLOATING_POINT -DPADDED_CELL_IF_NECESSARY"
          
          INCLUDES="-I kvm/VmCommon/h -I kvm/VmWin/h -I kvm/VmExtra/h"
          
          echo ""
          echo "=== Compiler settings ==="
          echo "CC: $CC"
          echo "CFLAGS: $CFLAGS"
          echo "DEFINES: $DEFINES"
          echo ""
          
          # Создаём список всех исходников
          SOURCES=""
          
          echo "=== Collecting VmCommon sources ==="
          for f in kvm/VmCommon/src/*.c; do
            echo "  + $(basename $f)"
            SOURCES="$SOURCES $f"
          done
          
          echo ""
          echo "=== Collecting VmWin sources ==="
          for f in kvm/VmWin/src/*.c; do
            echo "  + $(basename $f)"
            SOURCES="$SOURCES $f"
          done
          
          echo ""
          echo "=== Collecting VmExtra sources ==="
          for f in kvm/VmExtra/src/*.c; do
            # Пропускаем fp подпапку - соберём отдельно
            if [[ "$f" != *"/fp/"* ]]; then
              echo "  + $(basename $f)"
              SOURCES="$SOURCES $f"
            fi
          done
          
          echo ""
          echo "=== Collecting Floating Point sources (CRITICAL!) ==="
          FP_SOURCES=""
          for f in kvm/VmExtra/src/fp/*.c; do
            if [ -f "$f" ]; then
              echo "  + $(basename $f)"
              FP_SOURCES="$FP_SOURCES $f"
            fi
          done
          
          if [ -z "$FP_SOURCES" ]; then
            echo "WARNING: No floating point sources found!"
            echo "Checking directory..."
            ls -la kvm/VmExtra/src/fp/ || echo "Directory not found!"
          fi
          
          echo ""
          echo "=== Compiling all sources ==="
          
          # Компилируем всё одной командой
          $CC $CFLAGS $DEFINES $INCLUDES \
              $SOURCES $FP_SOURCES \
              -o bin/win32/kvm.exe \
              -lm -lws2_32
          
          echo ""
          echo "=== Build successful! ==="
          ls -la bin/win32/kvm.exe
          
          # Проверяем что floating point включён
          echo ""
          echo "=== Verifying floating point support ==="
          strings bin/win32/kvm.exe | grep -i "float" || echo "(no float strings, but should work)"

      - name: Build preverifier
        shell: msys2 {0}
        run: |
          echo "=== Building preverifier ==="
          
          CC="gcc"
          CFLAGS="-std=gnu89 -O2 -w"
          INCLUDES="-I tools/preverifier/src"
          
          # Собираем preverifier
          $CC $CFLAGS $INCLUDES \
              tools/preverifier/src/*.c \
              -o bin/win32/preverify.exe \
              2>/dev/null || echo "Preverifier build failed (optional)"
          
          ls -la bin/win32/

      - name: Create launcher
        shell: msys2 {0}
        run: |
          cat > bin/win32/midp.bat << 'EOFBAT'
          @echo off
          setlocal
          
          set "DIR=%~dp0"
          set "DIR=%DIR:~0,-1%"
          cd /d "%DIR%"
          
          set "CLASSES=%DIR%\lib\midp-classes"
          
          if "%~1"=="" (
              echo ================================================
              echo   KVM + MIDP 2.0 [Floating Point Enabled]
              echo ================================================
              echo.
              echo Usage: midp.bat game.jar MIDletClass
              echo.
              echo Examples:
              echo   midp.bat games\pushpuzzle.jar example.pushpuzzle.PushPuzzle
              echo   midp.bat games\games.jar example.wormgame.WormMain
              echo   midp.bat myapp.jar com.example.MyMIDlet
              echo.
              exit /b 0
          )
          
          set "JAR=%~1"
          set "MIDLET=%~2"
          
          if "%MIDLET%"=="" (
              echo ERROR: Please specify MIDlet class name
              echo.
              echo Check the .jad file for MIDlet-1: line
              exit /b 1
          )
          
          echo Starting: %MIDLET%
          echo.
          
          "%DIR%\kvm.exe" -classpath "%CLASSES%;%JAR%" %MIDLET%
          EOFBAT

      - name: Package distribution
        shell: msys2 {0}
        run: |
          echo "=== Creating distribution ==="
          
          mkdir -p dist/win64/lib/midp-classes
          mkdir -p dist/win64/games
          mkdir -p dist/win64/appdb
          
          # Наш собранный KVM (НЕ копируем старый midp.exe!)
          cp bin/win32/kvm.exe dist/win64/
          cp bin/win32/preverify.exe dist/win64/ 2>/dev/null || true
          cp bin/win32/midp.bat dist/win64/
          
          # MIDP классы
          cp -r bin/midp/classes/* dist/win64/lib/midp-classes/
          
          # Игры
          cp bin/midp/examples/*.jar dist/win64/games/ 2>/dev/null || true
          cp bin/midp/examples/*.jad dist/win64/games/ 2>/dev/null || true
          
          # Конфиги
          cat > dist/win64/lib/system.config << 'EOF'
          system.display.width: 240
          system.display.height: 320
          system.display.color: true
          system.display.color_depth: 8
          system.display.double_buffered: true
          EOF
          
          touch dist/win64/lib/internal.config
          
          # README
          cat > dist/win64/README.txt << 'EOF'
          KVM + MIDP 2.0 for Windows
          ==========================
          WITH FLOATING POINT SUPPORT!
          
          Usage:
            midp.bat games\pushpuzzle.jar example.pushpuzzle.PushPuzzle
            midp.bat your_app.jar com.example.YourMIDlet
          
          Or directly:
            kvm.exe -classpath "lib\midp-classes;game.jar" MIDletClass
          
          Check .jad files to find MIDlet class names.
          EOF
          
          echo ""
          echo "=== Distribution contents ==="
          ls -la dist/win64/
          echo ""
          echo "=== Verifying kvm.exe ==="
          file dist/win64/kvm.exe

      - uses: actions/upload-artifact@v4
        with:
          name: kvm-midp-win64
          path: dist/win64/

  # ============================================
  # Linux x64
  # ============================================
  build-linux:
    runs-on: ubuntu-latest
    needs: [build-midp-classes]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: midp-classes
          path: bin/midp/

      - name: Build KVM with Floating Point
        run: |
          set -e
          
          mkdir -p bin/linux
          
          CC="gcc"
          CFLAGS="-std=gnu89 -O2 -fno-strict-aliasing -w"
          DEFINES="-DUNIX -DLINUX -DFLOATING_POINT -DPADDED_CELL_IF_NECESSARY"
          INCLUDES="-I kvm/VmCommon/h -I kvm/VmUnix/h -I kvm/VmExtra/h"
          
          echo "=== Building KVM with Floating Point ==="
          
          SOURCES=""
          for f in kvm/VmCommon/src/*.c kvm/VmUnix/src/*.c; do
            SOURCES="$SOURCES $f"
          done
          
          for f in kvm/VmExtra/src/*.c; do
            [[ "$f" != *"/fp/"* ]] && SOURCES="$SOURCES $f"
          done
          
          FP_SOURCES=""
          for f in kvm/VmExtra/src/fp/*.c; do
            [ -f "$f" ] && FP_SOURCES="$FP_SOURCES $f"
          done
          
          echo "FP sources: $FP_SOURCES"
          
          $CC $CFLAGS $DEFINES $INCLUDES \
              $SOURCES $FP_SOURCES \
              -o bin/linux/kvm \
              -lm -lpthread
          
          echo "=== Build successful ==="
          ls -la bin/linux/kvm

      - name: Build preverifier
        run: |
          gcc -std=gnu89 -O2 -w \
              -I tools/preverifier/src \
              tools/preverifier/src/*.c \
              -o bin/linux/preverify 2>/dev/null || true

      - name: Create launcher
        run: |
          cat > bin/linux/midp << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          CLASSES="$DIR/lib/midp-classes"
          
          if [ -z "$1" ]; then
            echo "Usage: ./midp game.jar [MIDletClass]"
            exit 0
          fi
          
          JAR="$1"
          MIDLET="$2"
          
          [ ! -f "$JAR" ] && JAR="$DIR/$JAR"
          
          if [ -z "$MIDLET" ]; then
            MIDLET=$(unzip -p "$JAR" META-INF/MANIFEST.MF 2>/dev/null | \
                     grep -i "^MIDlet-1:" | rev | cut -d, -f1 | rev | tr -d ' \r\n')
          fi
          
          [ -z "$MIDLET" ] && { echo "Specify MIDlet class"; exit 1; }
          
          exec "$DIR/kvm" -classpath "$CLASSES:$JAR" "$MIDLET"
          EOF
          chmod +x bin/linux/midp

      - name: Package
        run: |
          mkdir -p dist/linux/lib/midp-classes dist/linux/games
          
          cp bin/linux/kvm dist/linux/
          cp bin/linux/preverify dist/linux/ 2>/dev/null || true
          cp bin/linux/midp dist/linux/
          
          cp -r bin/midp/classes/* dist/linux/lib/midp-classes/
          cp bin/midp/examples/*.jar dist/linux/games/ 2>/dev/null || true
          
          echo "system.display.width: 240" > dist/linux/lib/system.config
          touch dist/linux/lib/internal.config

      - uses: actions/upload-artifact@v4
        with:
          name: kvm-midp-linux-x64
          path: dist/linux/

  # ============================================
  # macOS (Intel + ARM)
  # ============================================
  build-macos:
    runs-on: macos-13
    needs: [build-midp-classes]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: midp-classes
          path: bin/midp/

      - name: Build KVM
        run: |
          set -e
          mkdir -p bin/macos
          
          CFLAGS="-std=gnu89 -O2 -fno-strict-aliasing -w"
          DEFINES="-DUNIX -DMACOSX -DFLOATING_POINT"
          INCLUDES="-I kvm/VmCommon/h -I kvm/VmUnix/h -I kvm/VmExtra/h"
          
          SOURCES=""
          for f in kvm/VmCommon/src/*.c kvm/VmUnix/src/*.c; do
            SOURCES="$SOURCES $f"
          done
          for f in kvm/VmExtra/src/*.c; do
            [[ "$f" != *"/fp/"* ]] && SOURCES="$SOURCES $f"
          done
          for f in kvm/VmExtra/src/fp/*.c; do
            [ -f "$f" ] && SOURCES="$SOURCES $f"
          done
          
          gcc $CFLAGS $DEFINES $INCLUDES $SOURCES -o bin/macos/kvm -lm

      - name: Package
        run: |
          mkdir -p dist/macos/lib/midp-classes dist/macos/games
          cp bin/macos/kvm dist/macos/
          cp -r bin/midp/classes/* dist/macos/lib/midp-classes/
          cp bin/midp/examples/*.jar dist/macos/games/ 2>/dev/null || true
          
          cat > dist/macos/midp << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/kvm" -classpath "$DIR/lib/midp-classes:$1" "$2"
          EOF
          chmod +x dist/macos/midp

      - uses: actions/upload-artifact@v4
        with:
          name: kvm-midp-macos
          path: dist/macos/

  # ============================================
  # Release
  # ============================================
  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create packages
        run: |
          mkdir -p release
          
          cd artifacts/kvm-midp-win64 && zip -r ../../release/kvm-midp-win64.zip . && cd ../..
          cd artifacts/kvm-midp-linux-x64 && tar -czvf ../../release/kvm-midp-linux-x64.tar.gz . && cd ../..
          cd artifacts/kvm-midp-macos && tar -czvf ../../release/kvm-midp-macos.tar.gz . && cd ../..
          
          # Games only
          mkdir games && cp midp2.0fcs/example/*.jar midp2.0fcs/example/*.jad games/ 2>/dev/null || true
          cd games && zip -r ../release/midp-games.zip . && cd ..

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "🎮 KVM + MIDP 2.0 (Floating Point) #${{ github.run_number }}"
          body: |
            ## ✅ KVM with Floating Point Support
            
            This build has **FLOATING POINT enabled** (`-DFLOATING_POINT`)
            
            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows x64 | `kvm-midp-win64.zip` |
            | Linux x64 | `kvm-midp-linux-x64.tar.gz` |
            | macOS | `kvm-midp-macos.tar.gz` |
            
            ### Usage
            ```batch
            REM Windows
            midp.bat games\pushpuzzle.jar example.pushpuzzle.PushPuzzle
            
            # Linux/macOS
            ./midp games/pushpuzzle.jar
            ```
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
